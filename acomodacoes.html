<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acomodações — Hotel Pousada Aquários</title>
  <meta name="description" content="Acomodações da Hotel Pousada Aquários, em Buritizeiro/MG.">
  <meta name="theme-color" content="#1A5FC2">

  <!-- Favicon (provisório, derivado da logo — substituir na entrega final) -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Fonte própria: pré-carrega o subset latin, usado logo no primeiro texto -->
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2"
        as="font" type="font/woff2" crossorigin>

  <!-- Bootstrap 5 + Bootstrap Icons (CDN com Subresource Integrity) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">

  <!-- CSS próprio: sempre depois do Bootstrap -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="aq-header" data-header>
    <div class="container">
      <nav class="navbar navbar-expand-lg aq-header__inner" aria-label="Navegação principal">

        <a class="navbar-brand aq-brand me-auto" href="index.html">
          <img src="img/logo-nav.webp"
               srcset="img/logo-nav.webp 300w, img/logo-nav@2x.webp 600w"
               sizes="(min-width: 992px) 77px, 61px"
               alt="Hotel Pousada Aquários — página inicial"
               width="300" height="218">
        </a>

        <button class="aq-toggler d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#aqMenu"
                aria-controls="aqMenu" aria-label="Abrir menu de navegação">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <div class="offcanvas offcanvas-end aq-offcanvas" tabindex="-1"
             id="aqMenu" aria-labelledby="aqMenuTitulo">
          <div class="offcanvas-header">
            <h2 class="offcanvas-title h6 mb-0" id="aqMenuTitulo">Menu</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                    aria-label="Fechar menu"></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav aq-nav align-items-lg-center">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Início</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="acomodacoes.html" aria-current="page">Acomodações</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="pousada.html">A Pousada</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="contato.html">Localização</a>
                </li>
            </ul>

            <!-- CTA principal. Vira link do WhatsApp assim que o número for
                 confirmado em js/main.js; até lá leva para a página de contato. -->
            <a class="btn-aq aq-header__cta" href="contato.html" data-whatsapp>
              Reservar
            </a>
          </div>
        </div>

      </nav>
    </div>
  </header>

  <main id="conteudo" class="aq-placeholder">
    <div class="container">
      <div class="aq-section-head mb-0">
        <div class="aq-rule"></div>
        <span class="aq-eyebrow">Em construção</span>
        <h1>Acomodações</h1>
        <p class="aq-lead aq-measure">
          O cabeçalho e a navegação já estão prontos. O conteúdo desta página
          entra na Fase 5.
        </p>
      </div>
    </div>
  </main>

  <!-- Botão flutuante de WhatsApp. Fica oculto até o número oficial ser
       confirmado e preenchido em js/main.js (roadmap, seção 26). -->
  <a class="aq-fab" href="#" data-whatsapp hidden
     aria-label="Conversar no WhatsApp">
    <i class="bi bi-whatsapp" aria-hidden="true"></i>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
